<!doctype html><html><head><meta charset="utf-8"><style>
:root{--paper:#f6f3ec;--surface:#fffdf8;--ink:#15130f;--ink2:#3a362d;--mut:#6b6558;--rule:#d9d3c3;--rule2:#b9b19b;--a:#1a47c9;--b:#c2410c;--ok:#0b6b4d;
--f-bg:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Source Serif 4",Georgia,serif}
.wrap{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1,h2,h3,.sans{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:clamp(1.9rem,1.2rem+3vw,2.9rem);line-height:1.08;letter-spacing:-.03em;margin:.4rem 0 .6rem}
h2{font-size:1.35rem;letter-spacing:-.015em;margin:2.6rem 0 .6rem;padding-top:1rem;border-top:1px solid var(--rule)}
.kicker{font:600 .78rem/1 Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.lede{font-size:1.2rem;color:var(--ink2);margin:.2rem 0 1rem}
.status{display:inline-block;font:600 .8rem/1 Inter,system-ui,sans-serif;background:#f8ecd2;color:#8a5200;border-radius:3px;padding:.35rem .5rem;margin:.3rem 0 1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem;margin:1.4rem 0}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.8rem .9rem}
.stat b{display:block;font:650 1.9rem/1.1 Inter,system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font:400 .82rem/1.35 Inter,system-ui,sans-serif;color:var(--mut)}
figure{margin:1.4rem 0;padding:1rem;background:var(--surface);border:1px solid var(--rule);border-radius:6px}
figcaption{font:400 .85rem/1.5 Inter,system-ui,sans-serif;color:var(--mut);margin-top:.6rem}figcaption strong{color:var(--ink2)}
table{border-collapse:collapse;width:100%;font:400 .85rem/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);padding:.4rem .5rem;text-align:right}th:first-child,td:first-child{text-align:left}th{font-weight:600;color:var(--ink2)}
.tw{overflow-x:auto}a{color:#1a47c9}code{font:.85em ui-monospace,Menlo,Consolas,monospace}
.limits li{margin:.35rem 0}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}figure,.stat{break-inside:avoid}h2{break-after:avoid}}
body{width:1200px;height:630px;margin:0;overflow:hidden;background:#f6f3ec}.card{padding:34px 48px}.card h1{font-size:44px;margin:.2rem 0 .3rem}.card p{margin:0 0 .6rem;font:400 20px/1.3 Inter,system-ui,sans-serif;color:#3a362d}.card .fig{background:#fffdf8;border:1px solid #d9d3c3;border-radius:8px;padding:10px 16px;height:372px}.card .fig svg{height:100%;width:100%}.foot{position:absolute;bottom:18px;left:48px;right:48px;font:600 16px Inter,system-ui,sans-serif;color:#6b6558;display:flex;justify-content:space-between}</style></head><body><div class="card"><p class="kicker">RoamingPigs research record</p><h1>ROCm was 1 to 12% slower than Vulkan</h1><p>Decode speed on one Strix Halo mini PC, same models and prompts, three repeats each.</p><div class="fig"><svg class="sh" viewBox="0 0 624 264" width="100%" role="img" aria-labelledby="f-ratio-t f-ratio-d" xmlns="http://www.w3.org/2000/svg"><style>
.sh text{font-family:var(--f-sans,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--f-ink2,#3a362d);font-size:12.5px}
.sh .t{fill:var(--f-ink,#15130f);font-weight:600}.sh .m{fill:var(--f-mut,#6b6558);font-size:11.5px}
.sh .v{font-family:var(--f-mono,ui-monospace,Menlo,Consolas,monospace);fill:var(--f-ink,#15130f);font-size:12px;font-weight:500}
.sh .big{font-size:26px;font-weight:650;fill:var(--f-ink,#15130f)}
.sh .g{stroke:var(--f-rule,#d9d3c3);stroke-width:1;fill:none}.sh .ax{stroke:var(--f-rule2,#b9b19b);stroke-width:1;fill:none}
.sh .a{stroke:var(--f-a,#1a47c9);fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.sh .b{stroke:var(--f-b,#c2410c);fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.sh .af{fill:var(--f-a,#1a47c9)}.sh .bf{fill:var(--f-b,#c2410c)}
.sh .aw{fill:var(--f-a,#1a47c9);opacity:.16}.sh .bw{fill:var(--f-b,#c2410c);opacity:.16}
.sh .hollow{fill:var(--f-bg,#fffdf8);stroke-width:2}
.sh .idle{stroke:var(--f-mut,#6b6558);stroke-width:1.25;stroke-dasharray:4 3}
.sh .win{fill:var(--f-ink,#15130f);opacity:.06}
.sh .ok{fill:var(--f-ok,#0b6b4d)}.sh .bad{fill:var(--f-bad,#a32020)}
.sh .chip{fill:var(--f-chip,#e1f1ea)}.sh .chipb{fill:var(--f-chipb,#f6dede)}

ity:0.19"/><text class="v" x="440.0" y="126.0" text-anchor="middle">97%</text><rect x="498" y="96" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.20"/><text class="v" x="552.0" y="126.0" text-anchor="middle">96%</text><text class="t" x="148" y="179.0" text-anchor="end">26B mixture</text><rect x="162" y="150" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.30"/><text class="v" x="216.0" y="180.0" text-anchor="middle">92%</text><rect x="274" y="150" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.33"/><text class="v" x="328.0" y="180.0" text-anchor="middle">90%</text><rect x="386" y="150" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.27"/><text class="v" x="440.0" y="180.0" text-anchor="middle">93%</text><rect x="498" y="150" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.21"/><text class="v" x="552.0" y="180.0" text-anchor="middle">96%</text><text class="t" x="148" y="233.0" text-anchor="end">35B mixture</text><rect x="162" y="204" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.38"/><text class="v" x="216.0" y="234.0" text-anchor="middle">88%</text><rect x="274" y="204" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.36"/><text class="v" x="328.0" y="234.0" text-anchor="middle">89%</text><rect x="386" y="204" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.33"/><text class="v" x="440.0" y="234.0" text-anchor="middle">91%</text><rect x="498" y="204" width="108" height="50" rx="4" style="fill:var(--f-b,#c2410c);opacity:0.26"/><text class="v" x="552.0" y="234.0" text-anchor="middle">94%</text></svg></div></div><div class="foot"><span>roamingpigs.org</span><span>Self-published. Not peer reviewed. One machine.</span></div></body></html>
