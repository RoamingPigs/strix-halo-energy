<svg class="sh" viewBox="0 0 700 440" width="100%" role="img" aria-labelledby="f-score-t f-score-d" xmlns="http://www.w3.org/2000/svg"><style>
.sh text{font-family:var(--f-sans,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--f-ink2,#3a362d);font-size:12.5px}
.sh .t{fill:var(--f-ink,#15130f);font-weight:600}.sh .m{fill:var(--f-mut,#6b6558);font-size:11.5px}
.sh .v{font-family:var(--f-mono,ui-monospace,Menlo,Consolas,monospace);fill:var(--f-ink,#15130f);font-size:12px;font-weight:500}
.sh .big{font-size:26px;font-weight:650;fill:var(--f-ink,#15130f)}
.sh .g{stroke:var(--f-rule,#d9d3c3);stroke-width:1;fill:none}.sh .ax{stroke:var(--f-rule2,#b9b19b);stroke-width:1;fill:none}
.sh .a{stroke:var(--f-a,#1a47c9);fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.sh .b{stroke:var(--f-b,#c2410c);fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.sh .af{fill:var(--f-a,#1a47c9)}.sh .bf{fill:var(--f-b,#c2410c)}
.sh .aw{fill:var(--f-a,#1a47c9);opacity:.16}.sh .bw{fill:var(--f-b,#c2410c);opacity:.16}
.sh .hollow{fill:var(--f-bg,#fffdf8);stroke-width:2}
.sh .idle{stroke:var(--f-mut,#6b6558);stroke-width:1.25;stroke-dasharray:4 3}
.sh .win{fill:var(--f-ink,#15130f);opacity:.06}
.sh .ok{fill:var(--f-ok,#0b6b4d)}.sh .bad{fill:var(--f-bad,#a32020)}
.sh .hm{stroke:var(--f-mut,#6b6558)}.sh .ha{stroke:var(--f-a,#1a47c9)}.sh .hb{stroke:var(--f-b,#c2410c)}.sh .lo{opacity:.45}
.sh .wf-idle{fill:var(--f-rule2,#b9b19b)}.sh .wf-a{fill:var(--f-a,#1a47c9)}.sh .wf-b{fill:var(--f-b,#c2410c)}
.sh .hm-a{fill:var(--f-a,#1a47c9)}.sh .hm-b{fill:var(--f-b,#c2410c)}.sh .hm-dash{fill:none;stroke:var(--f-mut,#6b6558);stroke-dasharray:2 3}
.sh .op1{opacity:.1}.sh .op2{opacity:.2}.sh .op3{opacity:.3}.sh .op4{opacity:.4}.sh .op5{opacity:.5}.sh .op6{opacity:.6}.sh .op7{opacity:.7}.sh .op8{opacity:.8}.sh .op9{opacity:.9}
.sh .chip{fill:var(--f-chip,#e1f1ea)}.sh .chipb{fill:var(--f-chipb,#f6dede)}
</style><title id="f-score-t">Expectations written in advance</title><desc id="f-score-d">P1 Vulkan on kernel 38 within 3% of study 1 in every cell: held; P2 ROCm within 25% of Vulkan; slower for the 26B mixture at 64: held; P3 ROCm gap shrinks or reverses with context for some model: held; P4 Idle under 25 W and within 2 W of study 1, both backends: held; P5 Wall power within 15% between backends, same cell: wrong; P6 Models rank the same by energy per token in both backends: held; P7 Repeat spread under 5% in every cell: held; P8 All 96 cells, 3 repeats; parse error only with the 26B mixture: held</desc><rect class="chip" x="0" y="0" width="640" height="46" rx="4"/><text class="t" x="14" y="22">P1</text><text x="52" y="22">Vulkan on kernel 38 within 3% of study 1 in every cell</text><text class="m" x="52" y="36">largest difference 1.52%</text><text class="ok t" x="626" y="22" text-anchor="end">held</text><rect class="chip" x="0" y="54" width="640" height="46" rx="4"/><text class="t" x="14" y="76">P2</text><text x="52" y="76">ROCm within 25% of Vulkan; slower for the 26B mixture at 64</text><text class="m" x="52" y="90">ROCm at 88 to 99% of Vulkan</text><text class="ok t" x="626" y="76" text-anchor="end">held</text><rect class="chip" x="0" y="108" width="640" height="46" rx="4"/><text class="t" x="14" y="130">P3</text><text x="52" y="130">ROCm gap shrinks or reverses with context for some model</text><text class="ok t" x="626" y="130" text-anchor="end">held</text><rect class="chip" x="0" y="162" width="640" height="46" rx="4"/><text class="t" x="14" y="184">P4</text><text x="52" y="184">Idle under 25 W and within 2 W of study 1, both backends</text><text class="m" x="52" y="198">idle 17 W Vulkan, 17 W ROCm, 16.5 W in study 1</text><text class="ok t" x="626" y="184" text-anchor="end">held</text><rect class="chipb" x="0" y="216" width="640" height="46" rx="4"/><text class="t" x="14" y="238">P5</text><text x="52" y="238">Wall power within 15% between backends, same cell</text><text class="m" x="52" y="252">ROCm wall power 87 to 117% of Vulkan</text><text class="bad t" x="626" y="238" text-anchor="end">wrong</text><rect class="chip" x="0" y="270" width="640" height="46" rx="4"/><text class="t" x="14" y="292">P6</text><text x="52" y="292">Models rank the same by energy per token in both backends</text><text class="ok t" x="626" y="292" text-anchor="end">held</text><rect class="chip" x="0" y="324" width="640" height="46" rx="4"/><text class="t" x="14" y="346">P7</text><text x="52" y="346">Repeat spread under 5% in every cell</text><text class="m" x="52" y="360">largest spread 1.26%</text><text class="ok t" x="626" y="346" text-anchor="end">held</text><rect class="chip" x="0" y="378" width="640" height="46" rx="4"/><text class="t" x="14" y="400">P8</text><text x="52" y="400">All 96 cells, 3 repeats; parse error only with the 26B mixture</text><text class="m" x="52" y="414">12 requests recovered after the parse error, 0 failed cells, 0 contaminated</text><text class="ok t" x="626" y="400" text-anchor="end">held</text></svg>